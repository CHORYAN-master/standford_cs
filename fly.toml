# Fly.io Deployment Configuration
app = "mcp-ai-agent"
primary_region = "nrt"  # Tokyo

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  
  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "40s"
    method = "GET"
    path = "/_stcore/health"

[env]
  LOG_LEVEL = "INFO"
  BASE_DIR = "/data"
  PROJECT_DIR = "/app"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_gb = 1

[[mounts]]
  source = "data"
  destination = "/data"
